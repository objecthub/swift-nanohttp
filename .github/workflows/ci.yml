name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Xcode project lists every Swift file once
        run: python3 Scripts/check_xcodeproj.py
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --enable-code-coverage
      - name: Coverage summary
        run: python3 Scripts/coverage_summary.py "$(swift test --show-codecov-path)"

  sanitizers:
    name: Tests under ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --sanitize=${{ matrix.sanitizer }}

  ios-demo:
    name: Build iOS demo app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for the iOS simulator
        run: |
          xcodebuild -project NanoHTTP.xcodeproj \
                     -scheme "DemoServer iOS" \
                     -destination 'generic/platform=iOS Simulator' \
                     CODE_SIGNING_ALLOWED=NO \
                     build
